<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Backend</title>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#0b0b0b;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

/* Main container */
#app{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:20px;
}

/* Row sections */
.action-row{
    display:flex;
    gap:8px;
    justify-content:space-between;
}

/* Inputs */
input{
    border-radius:8px;
    border:1px solid white;
    background:transparent;
    color:white;
    padding:6px;
    text-align:center;
    font-size:14px;
}

input:hover{
    background:white;
    color:black;
}

/* Buttons */
button{
    border-radius:8px;
    padding:6px 10px;
    border:none;
    background:white;
    color:black;
    font-size:14px;
    cursor:pointer;
}

button:hover{
    background:black;
    color:white;
    border:1px solid white;
    transition:0.2s ease;
}

/* Todo container */
#addtodos{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:10px;
    background:white;
    border-radius:8px;
    color: #0b0b0b;
}

/* Each todo card */
.todo{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:8px;
    border:2px solid black;
    border-radius:6px;
    background:white;
}

/* Title */
.todo-title{
    background:black;
    color:white;
    padding:4px;
    font-weight:600;
    border-radius: 5px;
}

/* Description */
.todo-desc{
    color:black;
    font-size:13px;
    padding: 4px;
}


    </style>
</head>
<body>
    

<div id="app">

<h1>Welcome to the ToDo App</h1>

<!-- Create Todo Section -->
    <div id="create-section">
        <input id="title" type="text" placeholder="Write title">
        <input id="task" type="text" placeholder="Write your todo">
        <button onclick="createTodo()">Create Todo</button>
    </div>

    <!-- Display Todos -->
    <div id="addtodos"></div>

<!-- Get All Todos -->
    <div id="get-all-section">
        <button onclick="getAllTodos()">Get All Todos</button>
    </div>

<!-- Get Single Todo -->
    <div class="action-row">
        <input id="todoID" type="text" placeholder="Todo ID">
        <button onclick="getTodo()">Get Todo</button>
    </div>

    <!-- Delete Todo -->
    <div class="action-row">
        <input id="deleteID" type="text" placeholder="Todo ID">
        <button onclick="deleteTodo()">Delete Todo</button>
    </div>

</div>




    <script>
        const url = "http://localhost:3000"
        async function createTodo() {
            const title = document.getElementById("title").value;
            const task = document.getElementById("task").value;

            if (title === "" || task === ""){
                alert("Invalid: Nothing entered!")
                return
            }

            const res = await fetch(url + "/create/todo", {
                method: "POST",
                headers: {"Content-Type" : "application/json"},
                body: JSON.stringify({
                    title: title,
                    description: task
                })
            })

            const json = await res.json();
            
            const todo = document.createElement("div");
            todo.className = "todo";

            const titlediv = document.createElement("div");
            titlediv.className = "todo-title";
            titlediv.innerHTML = json.title;

            const tododesc = document.createElement("div");
            tododesc.className = "todo-desc";
            tododesc.innerHTML = json.description;

            todo.appendChild(titlediv);
            todo.appendChild(tododesc);

            document.getElementById("addtodos").appendChild(todo);

            document.getElementById("title").value = "";
            document.getElementById("task").value = "";
 
        }


        //----

            async function getAllTodos() {
                res = await axios.get(url + "/todos");

                const json = res.data
                
                console.log(json)

                for (let i=0; i< json.length; i++) {

                }

            }
    </script>
</body>
</html>
