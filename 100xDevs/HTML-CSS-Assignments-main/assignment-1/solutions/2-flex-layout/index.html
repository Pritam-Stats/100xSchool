<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background-color: beige;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            min-height: 400px;
            background-color: royalblue;
            display: flex;
        }
        .left {
            background-color: red;
            flex: 1;
        }
        .right {
            background-color: royalblue;
            flex: 2;
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left content">
            <h1>left</h1>
        </div>
        <div class="right content">
            <h1>right</h1>
        </div>
    </div>
</body>
</html>
