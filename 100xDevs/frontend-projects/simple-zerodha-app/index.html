<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerodha Landing Page</title>
</head>
<body>

    <!--Nav area-->
    <nav style="box-sizing: border-box; box-shadow: 2px 1px 2px #eee; background-color: #fff; width: 100%; vertical-align: middle;">
    <!--parent div with flex-->
    <div style="display: flex; margin-left: 305px; margin-right: 305px;
        justify-content: space-between;">
        
        <div style="vertical-align: middle; padding-top: 20px;">  <!--first child div-->
            <img src="logo.svg" width="129.4" alt="logo">
        </div>
        
        <div style="display: flex; color: #666;"> <!--second child div-->
            <div style="padding: 20px; cursor: pointer;">Signup</div>
            <div style="padding: 20px; cursor: pointer;">About</div>
            <div style="padding: 20px; cursor: pointer;">Products</div>
            <div style="padding: 20px; cursor: pointer;">Pricing</div>
            <div style="padding: 20px; cursor: pointer;">Support</div>
        </div>
    </div>
    </nav>
    <!--nav ends-->

        <br>
        <br>
        <br>
        <br><br>

    <div style="display: flex; justify-content: center; size: 800px; margin-bottom: 60px;">
            <img src="landing-photo.svg" width="1000" alt="main photo">
    </div>


    <div style="text-align: center; font-family: 'Inter', serif;">
        
        <h1 style="font-size: 1.75rem; line-height: 1.25; font-weight: 500; color: #424242;">Invest in everything</h1>
        <p style="font-size: 1.25rem; font-weight: 400; line-height: 1.8; margin-top: 10px; margin-bottom: 40px;">Online platform to invest in stocks, derivatives, mutual funds, ETFs, bonds, and more.</p>
        
    </div>

    <div style="text-align: center; margin-top: 25px; box-sizing: border-box; ">
        <a href="https://google.com" 
        style="
            display: inline-block;
            background-color: #387ed1; 
            color: #fff; 
            text-decoration: none;
            
            border: 1px solid rgb(0, 0, 0, 0) !important; 
            border-radius: 3px; 
            padding: 10px 30px; 
            
            font-size: 1.3em; 
            line-height: 1.3em; 
            font-weight: 500; 
            
            cursor: pointer;"
            onmouseover="this.style.backgroundColor='#3E2723'"
            onmouseout="this.style.backgroundColor='#387ed1'"
            >
            
        Sign up for free
        </a>
    </div>
</body>
</html>
